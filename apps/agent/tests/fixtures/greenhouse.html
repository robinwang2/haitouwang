<!doctype html>
<html>
  <body>
    <form data-platform="greenhouse" action="https://boards.greenhouse.io/acme/jobs/42">
      <label for="first_name">First name</label>
      <input id="first_name" name="job_application[first_name]" required />
      <label for="last_name">Last name</label>
      <input id="last_name" name="job_application[last_name]" required />
      <label for="email">Email</label>
      <input id="email" name="job_application[email]" type="email" required />
      <label for="phone">Phone</label>
      <input id="phone" name="job_application[phone]" type="tel" required />
      <label for="resume">Resume/CV</label>
      <input id="resume" name="job_application[resume]" type="file" accept=".pdf" required />
      <label for="cover_letter">Cover letter</label>
      <input id="cover_letter" name="job_application[cover_letter]" type="file" accept=".pdf" />
      <button type="submit">Submit application</button>
    </form>
  </body>
</html>
