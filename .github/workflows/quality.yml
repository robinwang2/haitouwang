name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - 'studio/**'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false

      - name: Install quality tooling
        working-directory: tooling
        run: npm ci --ignore-scripts

      - name: Install application workspaces
        working-directory: tooling
        run: npm run bootstrap

      - name: Validate development infrastructure
        working-directory: tooling
        run: npm run infra:validate

      - name: Lint
        working-directory: tooling
        run: npm run lint

      - name: Typecheck
        working-directory: tooling
        run: npm run typecheck

      - name: Unit tests
        working-directory: tooling
        run: npm run unit

      - name: Contract tests
        working-directory: tooling
        run: npm run contract

      - name: Dependency and secret scans
        working-directory: tooling
        run: npm run security
